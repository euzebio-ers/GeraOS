name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (formatação, análise e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

  banco:
    name: Banco (migrations e pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Subir banco e aplicar migrations
        run: supabase db start

      - name: Testes do banco
        run: supabase test db